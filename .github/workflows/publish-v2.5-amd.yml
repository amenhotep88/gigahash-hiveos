name: Publish GigaHash HiveOS v2.5 AMD

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v2.5-amd.yml]

permissions:
  contents: write

env:
  OFFICIAL_ARCHIVE_SHA256: 529abd01baf0eaf73ea420fcb373739680c0d6a2a42210f959dab4676b43b4e5
  BINARY_SHA256: 1e10d5793aa70fdf6f52666e06e264f7079eb91bdb1f4073223777e54db1612b
  PACKAGE_SHA256: c6497a2f9a5200a4b064845faff6d3debe6a1428cbc02c876bcfa5d4493db90b
  GH_PART_LAST: 142

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify official AMD HiveOS miner
        run: |
          set -euo pipefail
          archive=/tmp/gigahash-zk-amd-2.5.tar.gz
          curl -fL --retry 3 --connect-timeout 20 -o "$archive" \
            https://cdn.gigahash.cloud/releases/2.5/hiveos/gigahash-zk-amd-2.5.tar.gz
          echo "$OFFICIAL_ARCHIVE_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C /tmp gigahash-zk-amd/gigahash-zk-amd
          echo "$BINARY_SHA256  /tmp/gigahash-zk-amd/gigahash-zk-amd" | sha256sum -c -
          chmod 755 /tmp/gigahash-zk-amd/gigahash-zk-amd
          test "$(/tmp/gigahash-zk-amd/gigahash-zk-amd --version)" = 'gigahash-zk 2.5'

      - name: Split verified official AMD archive
        run: |
          set -euo pipefail
          mkdir -p vendor
          find vendor -maxdepth 1 -name 'gigahash-zk-amd-2.5.tar.gz.part-*' -delete
          split -b 700000 -d -a 3 /tmp/gigahash-zk-amd-2.5.tar.gz \
            vendor/gigahash-zk-amd-2.5.tar.gz.part-
          test "$(find vendor -maxdepth 1 -name 'gigahash-zk-amd-2.5.tar.gz.part-*' | wc -l)" -eq "$((GH_PART_LAST + 1))"

      - name: Test and build AMD HiveOS package
        run: |
          set -euo pipefail
          chmod 755 build-amd.sh tests/test_*.sh
          for test_script in tests/test_*.sh; do bash "$test_script"; done
          ./build-amd.sh
          echo "$PACKAGE_SHA256  gigahash-amd-2.5.0.tar.gz" | sha256sum -c -

      - name: Commit AMD package assets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gigahash-amd-2.5.0.tar.gz vendor/gigahash-zk-amd-2.5.tar.gz.part-*
          if git diff --cached --quiet; then
            echo 'AMD assets already match the verified build.'
          else
            git commit -m 'Publish verified GigaHash ZK v2.5 AMD assets'
            git push origin HEAD:main
          fi
          echo "ASSET_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish AMD GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/notes.md <<'NOTES'
          HiveOS Custom Miner for the official GigaHash ZK v2.5 AMD miner.

          - AMD Radeon RX 6000 / 7000 / 9000 series; Ubuntu 22.04+.
          - Package: `gigahash-amd-2.5.0.tar.gz`.
          - Official archive SHA-256: `529abd01baf0eaf73ea420fcb373739680c0d6a2a42210f959dab4676b43b4e5`.
          - Official binary SHA-256: `1e10d5793aa70fdf6f52666e06e264f7079eb91bdb1f4073223777e54db1612b`.
          - Package SHA-256: `c6497a2f9a5200a4b064845faff6d3debe6a1428cbc02c876bcfa5d4493db90b`.
          - Default endpoint: `backup.gigahash.cloud:9100`.
          NOTES
          if gh release view v2.5.0-amd1 >/dev/null 2>&1; then
            gh release upload v2.5.0-amd1 gigahash-amd-2.5.0.tar.gz --clobber
            gh release edit v2.5.0-amd1 --target "$ASSET_COMMIT" \
              --title 'GigaHash ZK v2.5 AMD for HiveOS' --notes-file /tmp/notes.md
          else
            gh release create v2.5.0-amd1 gigahash-amd-2.5.0.tar.gz \
              --target "$ASSET_COMMIT" --title 'GigaHash ZK v2.5 AMD for HiveOS' \
              --notes-file /tmp/notes.md
          fi
