name: Publish GigaHash HiveOS v2.4 AMD

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v2.4-amd.yml]

permissions:
  contents: write

env:
  OFFICIAL_ARCHIVE_SHA256: 9f34a1e4c341364de88b8324410e3d180fefb0f183dc38dba53b14e2469a822f
  BINARY_SHA256: 93d57c24b5223482cb461147baaf447797d72483aa22a37c33d292a2ea3c6802
  PACKAGE_SHA256: 64c0a3afbd849984a5a04c4d49864f4438787d1d3fde6d8a87307d88eaf74b82
  GH_PART_LAST: 136

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify official AMD HiveOS miner
        run: |
          set -euo pipefail
          archive=/tmp/gigahash-zk-amd-2.4.tar.gz
          curl -fL --retry 3 --connect-timeout 20 -o "$archive" \
            https://cdn.gigahash.cloud/releases/2.4/hiveos/gigahash-zk-amd-2.4.tar.gz
          echo "$OFFICIAL_ARCHIVE_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C /tmp gigahash-zk-amd/gigahash-zk-amd
          echo "$BINARY_SHA256  /tmp/gigahash-zk-amd/gigahash-zk-amd" | sha256sum -c -
          chmod 755 /tmp/gigahash-zk-amd/gigahash-zk-amd
          test "$(/tmp/gigahash-zk-amd/gigahash-zk-amd --version)" = 'gigahash-zk 2.4'

      - name: Split verified official AMD archive
        run: |
          set -euo pipefail
          mkdir -p vendor
          find vendor -maxdepth 1 -name 'gigahash-zk-amd-2.4.tar.gz.part-*' -delete
          split -b 700000 -d -a 3 /tmp/gigahash-zk-amd-2.4.tar.gz \
            vendor/gigahash-zk-amd-2.4.tar.gz.part-
          test "$(find vendor -maxdepth 1 -name 'gigahash-zk-amd-2.4.tar.gz.part-*' | wc -l)" -eq "$((GH_PART_LAST + 1))"

      - name: Test and build AMD HiveOS package
        run: |
          set -euo pipefail
          chmod 755 build-amd.sh tests/test_*.sh
          for test_script in tests/test_*.sh; do bash "$test_script"; done
          ./build-amd.sh
          echo "$PACKAGE_SHA256  gigahash-amd-2.4.0.tar.gz" | sha256sum -c -

      - name: Commit AMD package assets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gigahash-amd-2.4.0.tar.gz vendor/gigahash-zk-amd-2.4.tar.gz.part-*
          if git diff --cached --quiet; then
            echo 'AMD assets already match the verified build.'
          else
            git commit -m 'Publish verified GigaHash ZK v2.4 AMD assets'
            git push origin HEAD:main
          fi
          echo "ASSET_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish AMD GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/notes.md <<'NOTES'
          HiveOS Custom Miner for the official GigaHash ZK v2.4 AMD miner.

          - AMD Radeon RX 6000 / 7000 / 9000 series; Ubuntu 22.04+.
          - Package: `gigahash-amd-2.4.0.tar.gz`.
          - Official archive SHA-256: `9f34a1e4c341364de88b8324410e3d180fefb0f183dc38dba53b14e2469a822f`.
          - Official binary SHA-256: `93d57c24b5223482cb461147baaf447797d72483aa22a37c33d292a2ea3c6802`.
          - Package SHA-256: `64c0a3afbd849984a5a04c4d49864f4438787d1d3fde6d8a87307d88eaf74b82`.
          - Default endpoint: `backup.gigahash.cloud:9100`.
          NOTES
          if gh release view v2.4.0-amd1 >/dev/null 2>&1; then
            gh release upload v2.4.0-amd1 gigahash-amd-2.4.0.tar.gz --clobber
            gh release edit v2.4.0-amd1 --target "$ASSET_COMMIT" \
              --title 'GigaHash ZK v2.4 AMD for HiveOS' --notes-file /tmp/notes.md
          else
            gh release create v2.4.0-amd1 gigahash-amd-2.4.0.tar.gz \
              --target "$ASSET_COMMIT" --title 'GigaHash ZK v2.4 AMD for HiveOS' \
              --notes-file /tmp/notes.md
          fi
